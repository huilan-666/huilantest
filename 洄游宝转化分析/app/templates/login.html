{% load static %}<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="page-id" content="PAGE-F01-01"><title>登录 · 洄游首交诊断</title><link rel="stylesheet" href="{% static 'tokens.css' %}"><link rel="stylesheet" href="{% static 'app.css' %}"></head><body><div class="login"><section class="login-story"><div class="login-brand">洄游 · 首交诊断</div><h1>从商机推进，<br>到有依据的行动。</h1><p>分清停在哪一步，核实为什么，<br>用两轮复盘检验实际进展。</p><small>新客首交 / 分层诊断 / 双周复盘</small></section><main class="login-form"><div class="eyebrow">内部业务工作台</div><h2>登录首交诊断</h2><p class="muted">使用运营开通的内部账号</p>{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>账号 *<input name="username" value="{{ username }}" required autocomplete="username" autofocus></label><label>密码 *<input name="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">进入工作台</button></form><p class="login-foot">本地应用 · 账号由运营管理<br>首次启动的随机凭据见 app/runtime/本地登录凭据.json</p></main></div></body></html>
