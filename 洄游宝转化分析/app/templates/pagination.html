{% if entries.paginator %}<div class="pagination"><span>共{{ entries.paginator.count }}条 · 第{{ entries.number }}/{{ entries.paginator.num_pages }}页</span><div>{% if entries.has_previous %}<a href="?{{ page_query }}&page={{ entries.previous_page_number }}">上一页</a>{% endif %} {% if entries.has_next %}<a href="?{{ page_query }}&page={{ entries.next_page_number }}">下一页</a>{% endif %}</div></div>{% endif %}
